<style>
*{

}

body{

    background:#f5f7ff;
    color:#1f2937;
    line-height:1.7;
}

.hero{
    background:linear-gradient(135deg,#4338ca,#7c3aed,#0284c7);
    color:white;
    text-align:center;
    padding:55px 20px;
}

.hero h1{
    margin:0 0 8px;
    font-size:40px;
}

.container{
    max-width:900px;
    margin:35px auto;
    padding:20px;
}

.box{
    background:white;
    padding:30px;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

h2{
    color:#4f46e5;
}

label{
    display:block;
    margin-top:18px;
    font-weight:bold;
}

input,textarea{
    width:100%;
    padding:13px;
    margin-top:7px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
}

textarea{
    min-height:110px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:0;

    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#result{
    display:none;
    margin-top:30px;
}

.report{
    background:white;
    padding:35px;
    border-radius:22px;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
}

.report h1{
    text-align:center;
    color:#312e81;
}

.report h2{
    margin-top:30px;
    border-bottom:2px solid #e0e7ff;
    padding-bottom:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    margin:20px 0;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
}

th{
    background:#eef2ff;
}

.print{
    background:#059669;
}

@media(max-width:600px){

    .hero h1{
        font-size:30px;
    }

    .box,.report{
        padding:20px;
    }
}

@media print{

    .hero,
    .box,
    .print{
        display:none;
    }

    .report{
        box-shadow:none;
    }
}
</style>
</head>
