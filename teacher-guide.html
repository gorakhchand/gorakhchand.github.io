<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teacher's Guide | Gorakh Chand</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9ff;
    color:#1f2937;
    line-height:1.7;
}

/* NAVIGATION */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.97);
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:800;
    background:linear-gradient(90deg,#6d28d9,#2563eb,#0891b2);
    -webkit-background-clip:text;
    color:transparent;
}

.back{
    text-decoration:none;
    color:#4338ca;
    font-weight:bold;
}

/* HERO */

.hero{
    padding:75px 20px;
    text-align:center;
    color:white;

    background:
    radial-gradient(circle at 15% 20%,#22d3ee55,transparent 30%),
    radial-gradient(circle at 85% 80%,#f472b655,transparent 30%),
    linear-gradient(135deg,#4338ca,#7c3aed,#0284c7);
}

.hero h1{
    font-size:45px;
    margin-bottom:10px;
}

.hero p{
    font-size:18px;
}

/* CONTENT */

.container{
    max-width:1150px;
    margin:auto;
    padding:60px 20px;
}

.title{
    text-align:center;
    margin-bottom:40px;
}

.title h2{
    color:#5b21b6;
    font-size:36px;
}

.title p{
    color:#6b7280;
}

/* CLASS GRID */

.book-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

/* CLASS CARD */

.book-card{
    background:white;
    padding:28px 22px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.08);
    border-top:5px solid #6d28d9;
    transition:.3s;
}

.book-card:hover{
    transform:translateY(-6px);
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.book-icon{
    font-size:45px;
    margin-bottom:8px;
}

.book-card h3{
    color:#4338ca;
    font-size:24px;
    margin-bottom:15px;
}

/* SUBJECT */

.subject{
    padding:10px 0;
    border-bottom:1px solid #e5e7eb;
}

.subject:last-child{
    border-bottom:none;
}

.subject-name{
    font-weight:bold;
    color:#374151;
    font-size:14px;
    margin-bottom:7px;
}

/* BUTTONS */

.buttons{
    display:flex;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:6px 12px;
    border-radius:18px;
    text-decoration:none;
    font-size:12px;
    font-weight:bold;
}

.view{
    background:#eef2ff;
    color:#4338ca;
}

.download{
    background:#4338ca;
    color:white;
}

.btn:hover{
    opacity:.85;
}

/* NOTE */

.note{
    margin-top:45px;
    padding:30px;
    border-radius:22px;
    text-align:center;
    background:linear-gradient(135deg,#eef2ff,#f5f3ff);
}

.note h2{
    color:#5b21b6;
    margin-bottom:8px;
}

/* FOOTER */

footer{
    margin-top:20px;
    padding:28px 20px;
    text-align:center;
    color:#9ca3af;
    background:#111827;
}

/* RESPONSIVE */

@media(max-width:950px){

    .book-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:600px){

    .hero h1{
        font-size:35px;
    }

    .book-grid{
        grid-template-columns:1fr;
    }

    .logo{
        font-size:21px;
    }

}

</style>

</head>
