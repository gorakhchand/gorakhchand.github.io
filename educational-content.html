<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Educational Content | Gorakh Chand</title>

<meta name="description" content="Educational resources, Computer Science, Python, ICT, SEE materials and teaching resources by Gorakh Chand.">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f7f9ff;
    color:#1f2937;
    line-height:1.7;
}

/* NAVIGATION */

nav{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,255,255,.97);
    box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.navbar{
    max-width:1200px;
    margin:auto;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:24px;
    font-weight:800;
    background:linear-gradient(90deg,#6d28d9,#2563eb,#0891b2);
    -webkit-background-clip:text;
    color:transparent;
}

nav ul{
    display:flex;
    list-style:none;
    gap:17px;
}

nav a{
    text-decoration:none;
    color:#374151;
    font-weight:600;
    transition:.3s;
}

nav a:hover{
    color:#2563eb;
}

/* ACTIVE MENU */

nav a.active{
    color:#6d28d9;
}

/* HERO */

.hero{
    padding:85px 20px;
    text-align:center;
    color:white;

    background:
    radial-gradient(circle at 15% 20%,#22d3ee55,transparent 30%),
    radial-gradient(circle at 85% 80%,#f472b655,transparent 30%),
    linear-gradient(135deg,#4338ca,#7c3aed,#0284c7);
}

.hero h1{
    font-size:48px;
    margin-bottom:10px;
}

.hero p{
    font-size:19px;
}

/* CONTENT */

.container{
    max-width:1100px;
    margin:auto;
    padding:65px 20px;
}

.title{
    text-align:center;
    margin-bottom:45px;
}

.title h2{
    font-size:38px;
    color:#5b21b6;
}

.title p{
    color:#6b7280;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:white;
    padding:30px 25px;
    border-radius:22px;
    text-align:center;
    box-shadow:0 8px 25px rgba(0,0,0,.07);
    border-top:5px solid #6d28d9;
    transition:.3s;
}

.card:hover{
    transform:translateY(-7px);
    box-shadow:0 15px 35px rgba(0,0,0,.12);
}

.icon{
    font-size:48px;
    margin-bottom:12px;
}

.card h3{
    color:#4338ca;
    margin-bottom:10px;
}

.card p{
    color:#4b5563;
}

.card a{
    display:inline-block;
    margin-top:18px;
    padding:9px 20px;
    border-radius:25px;
    background:#eef2ff;
    color:#4338ca;
